name: Validate public evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Validate portfolio guardrails
        run: python scripts/validate_portfolio.py

      - name: Run evidence tests
        run: pytest -q
